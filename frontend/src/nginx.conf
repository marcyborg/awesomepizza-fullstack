server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # opzionale: proxy diretto verso backend se vuoi evitare CORS
    # location /api/ {
    #     proxy_pass http://backend:8080;
    # }
}
